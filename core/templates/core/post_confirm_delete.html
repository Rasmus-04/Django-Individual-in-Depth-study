<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{% url 'home' %}">In-Depth Study</a>
            <a class="btn btn-outline-secondary btn-sm" href="{% url 'post_list' %}">Back to posts</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h3 fw-semibold mb-3">Delete post?</h1>
                        <p class="text-secondary">Are you sure you want to delete this post?.</p>
                        <blockquote class="bg-light border rounded-3 p-3 mb-4">{{ post.text }}</blockquote>

                        <form method="post" class="d-flex flex-wrap gap-2">
                            {% csrf_token %}
                            <button class="btn btn-danger" type="submit">Confirm delete</button>
                            <a class="btn btn-light border" href="{% url 'post_list' %}">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
