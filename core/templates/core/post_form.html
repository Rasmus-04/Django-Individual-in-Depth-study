<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if post %}Edit Post{% else %}Create Post{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{% url 'home' %}">In-Depth Study</a>
            <a class="btn btn-outline-secondary btn-sm" href="{% url 'post_list' %}">Back to posts</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-xl-6">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h3 fw-semibold mb-2">
                            {% if post %}Edit post{% else %}Create a post{% endif %}
                        </h1>

                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <div class="d-flex gap-2 mt-4">
                                <button class="btn btn-primary" type="submit">
                                    {% if post %}Save changes{% else %}Create post{% endif %}
                                </button>
                                <a class="btn btn-light border" href="{% url 'post_list' %}">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <style>
        form p input, form p textarea, form p select {
            display: block; width: 100%; padding: .55rem .75rem;
            border: 1px solid #dee2e6; border-radius: .5rem; background: #fff;
        }
        form p label { display: block; margin-bottom: .4rem; font-weight: 500; }
    </style>
</body>
</html>
