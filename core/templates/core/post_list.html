<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Posts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{% url 'home' %}">In-Depth Study</a>
            <a class="btn btn-primary btn-sm" href="{% url 'home' %}">Home page</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h1 class="h2 fw-semibold mb-1">Posts</h1>
            </div>
            <a class="btn btn-outline-secondary" href="{% url 'post_create' %}">+ Create post</a>
        </div>

        <div class="d-grid gap-3">
            {% for post in posts %}
                <article class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-4">
                        <h2 class="h5 mb-3">{{ post.text }}</h2>
                        <div class="d-flex flex-wrap gap-3 text-secondary small mb-3">
                            <span><strong class="text-dark">Status:</strong> {{ post.status }}</span>
                            <span><strong class="text-dark">Created:</strong> {{ post.created_date }}</span>
                        </div>
                        <div class="d-flex gap-2">
                            <a class="btn btn-sm btn-outline-primary" href="{% url 'post_update' post.id %}">Edit</a>
                            <a class="btn btn-sm btn-outline-danger" href="{% url 'post_delete' post.id %}">Delete</a>
                        </div>
                    </div>
                </article>
            {% empty %}
                <div class="bg-white border rounded-3 p-5 text-center">
                    <h2 class="h5 mb-2">No posts yet</h2>
                    <p class="text-secondary mb-3">Create your first post to get started.</p>
                    <a class="btn btn-primary" href="{% url 'post_create' %}">Create post</a>
                </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
